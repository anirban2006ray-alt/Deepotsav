<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwali Night – 3D (ghat · lanterns · diyas)</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block}
  #cap{position:fixed;left:0;right:0;top:50%;text-align:center;color:#fff;font:700 clamp(16px,3.6vw,26px) system-ui;text-shadow:0 2px 6px #000;pointer-events:none;white-space:pre-line}
  #cap span{display:inline-block;animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  #tag{position:fixed;left:12px;top:12px;color:#fffa;font:600 12px system-ui;letter-spacing:.12em}
  #dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#000e;color:#ffd9a0}
  #start button{font:600 1.1rem system-ui;padding:14px 30px;border:0;border-radius:999px;background:#ff9933;color:#2a1000;cursor:pointer;border:none}
  #start button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){#cap span{animation:none}}
</style>
</head>
<body>
<audio id="aud" src="/assets/aistudio/audio_242fa111.m4a" loop preload="auto"></audio>
<div id="tag"></div><div id="cap" aria-live="polite"></div><div id="dim"></div>
<div id="start"><p>Diwali night · 3D · sound on</p><button id="go">Start 3D Experience</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const aud=document.getElementById('aud'),capEl=document.getElementById('cap'),dimEl=document.getElementById('dim'),tag=document.getElementById('tag');
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x03030b);
const cam=new THREE.PerspectiveCamera(55,1,.1,300);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});dispatchEvent(new Event('resize'));
const AD=THREE.AdditiveBlending,rnd=(()=>{let s=11;return()=>(s=(s*16807)%2147483647)/2147483647;})(),ease=x=>{x=Math.min(Math.max(x,0),1);return x*x*(3-2*x);};
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'#fff');r.addColorStop(.25,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
const glow=(p,s,c,o=1)=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,blending:AD,transparent:true,depthWrite:false,opacity:o}));m.position.copy(p);m.scale.setScalar(s);return m;};
const cloud=(n,fn,size,vc)=>{const p=new Float32Array(n*3),c=new Float32Array(n*3);for(let i=0;i<n;i++){const [x,y,z,r,g,b]=fn(i);p.set([x,y,z],i*3);c.set([r,g,b],i*3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const m=new THREE.Points(g,new THREE.PointsMaterial({size,map:glowTex,vertexColors:true,transparent:true,blending:AD,depthWrite:false}));m.frustumCulled=false;return m;};
const warm=()=>{const k=.5+rnd()*.5;return [1*k,(.65+rnd()*.3)*k,(.3+rnd()*.3)*k];};

/* ---------- spark pool (fireworks) ---------- */
const N=7000,pos=new Float32Array(N*3),vel=new Float32Array(N*3),life=new Float32Array(N),ml=new Float32Array(N),col=new Float32Array(N*3),drg=new Float32Array(N),gv=new Float32Array(N);let head=0;
const emit=(x,y,z,vx,vy,vz,l,c,d,g)=>{const i=head;head=(head+1)%N;pos.set([x,y,z],i*3);vel.set([vx,vy,vz],i*3);life[i]=ml[i]=l;col.set(c,i*3);drg[i]=d;gv[i]=g;};
const gp=new Float32Array(N*9),gc=new Float32Array(N*9),pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(gp,3));pg.setAttribute('color',new THREE.BufferAttribute(gc,3));
const sparks=new THREE.Points(pg,new THREE.PointsMaterial({size:1.1,map:glowTex,vertexColors:true,transparent:true,blending:AD,depthWrite:false}));sparks.frustumCulled=false;scene.add(sparks);
function stepPool(dt,t){for(let i=0;i<N;i++){const o=i*3,q=i*9;if(life[i]<=0){if(gc[q]||gc[q+1]||gc[q+2])gc.fill(0,q,q+9);continue;}
  life[i]-=dt;const d=Math.pow(drg[i],dt*60);vel[o]*=d;vel[o+1]=vel[o+1]*d-gv[i]*dt;vel[o+2]*=d;pos[o]+=vel[o]*dt;pos[o+1]+=vel[o+1]*dt;pos[o+2]+=vel[o+2]*dt;
  const f=Math.max(life[i]/ml[i],0),a=Math.min(1,f*2.2)*(f<.4?.6+.4*Math.sin(t*38+i):1);
  for(let L=0;L<3;L++){const s=[0,.05,.12][L],b=[1,.55,.25][L]*a,k=q+L*3;gp[k]=pos[o]-vel[o]*s;gp[k+1]=pos[o+1]-vel[o+1]*s;gp[k+2]=pos[o+2]-vel[o+2]*s;gc[k]=col[o]*b;gc[k+1]=col[o+1]*b;gc[k+2]=col[o+2]*b;}}
  pg.attributes.position.needsUpdate=pg.attributes.color.needsUpdate=true;}
function burst(x,y,z,v0,n,pal,g=6,d=.97){for(let i=0;i<n;i++){const a=rnd()*6.283,b=Math.acos(2*rnd()-1),s=v0*(rnd()<.9?.92+.08*rnd():.4);
  emit(x,y,z,Math.sin(b)*Math.cos(a)*s,Math.sin(b)*Math.sin(a)*s,Math.cos(b)*s,2.2+rnd()*1.6,pal[i%pal.length],d,g);}}

/* ---------- 1. aerial ghat ---------- */
const ghat=new THREE.Group();scene.add(ghat);
ghat.add(cloud(16000,()=>{const x=(rnd()-.35)*70,z=-8-Math.pow(rnd(),.8)*70,c=warm();return [x,0,z,c[0]*.8,c[1]*.8,c[2]*.8];},.5));
ghat.add(cloud(3500,()=>{const x=-36+rnd()*40,z=-48-rnd()*28,c=warm();return [x,1+rnd()*9,z,c[0],c[1],c[2]];},.7));
const spire=new THREE.Mesh(new THREE.ConeGeometry(2.2,9,10),new THREE.MeshBasicMaterial({color:0xd23c96}));spire.position.set(-8,4.5,-46);ghat.add(spire,glow(spire.position,26,0xd23c96,.6));
for(let i=0;i<5;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(5+rnd()*5,6+rnd()*8,6),new THREE.MeshBasicMaterial({color:0x2a1608}));b.position.set(-30+i*6,4,-52-rnd()*8);ghat.add(b);}
const orangeCloud=glow(new THREE.Vector3(0,12,-75),120,0xe0702a,.0);scene.add(orangeCloud);

/* ---------- 2/3. sky lanterns ---------- */
const NL=650,lant=cloud(NL,()=>{const c=rnd()<.8?warm():[1,.55,.8];return [(rnd()-.5)*130,rnd()*70-8,-12-rnd()*85,c[0],c[1],c[2]];},2.4);scene.add(lant);
const LP=lant.geometry.attributes.position,LSP=Float32Array.from({length:NL},()=>1.2+rnd()*2.2);
function bigLantern(x,y,z,s){const m=new THREE.Mesh(new THREE.CylinderGeometry(s*.5,s*.4,s*1.1,18,1,true),new THREE.MeshBasicMaterial({color:0xff9a3c,side:THREE.DoubleSide,transparent:true,opacity:.9}));
  m.position.set(x,y,z);const g=glow(new THREE.Vector3(x,y-s*.5,z),s*2.4,0xffc766,.9);scene.add(m,g);return {m,g,y0:y};}
const bigs=[bigLantern(-1.5,-9,-14,5),bigLantern(7,-14,-9,11)];

/* ---------- 4. diyas ---------- */
const diya=new THREE.Group();scene.add(diya);
diya.add(new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshBasicMaterial({color:0x140a07})).rotateX(-1.5708));
[[.1,5],[.16,7],[.22,9],[.28,11]].forEach(([r,k],ri)=>diya.add(cloud(k*5,i=>{const a=i/(k*5)*6.283*2.2+ri,c=[[1,.6,.08],[.85,.15,.12],[1,.9,.6],[1,.5,.05]][(i+ri)%4];return [Math.cos(a)*(ri*1.7+2.4),.1,-7+Math.sin(a)*(ri*1.7+2.4),c[0],c[1],c[2]];},.9)));
const flames=[];[[0,-2],[-7,-3],[7,-5],[-6,5],[6,3]].forEach(([x,z],i)=>{const bowl=new THREE.Mesh(new THREE.SphereGeometry(1.3-i*.07,20,10,0,6.283,0,1.5708).rotateX(3.1416),new THREE.MeshBasicMaterial({color:0xb4462a}));
  bowl.position.set(x,.9,z);const f=glow(new THREE.Vector3(x,1.7,z),5,0xffe0a0);const h=glow(new THREE.Vector3(x,1.2,z),16,0xff8a2a,.6);diya.add(bowl,f,h);flames.push([f,h,i]);});
diya.visible=false;

/* ---------- timeline ---------- */
const SHOW=[[3.8,()=>burst(0,22,-70,19,1400,[[1,.85,.45],[1,.7,.3],[1,.95,.7]],7,.975)],[4.5,()=>burst(-18,6,-80,6,200,[[1,.4,.5],[1,.8,.6]])],[4.9,()=>burst(16,5,-80,6,200,[[.4,.8,1],[1,1,1]])],[5.3,()=>burst(2,4,-85,6,200,[[1,.6,.3],[1,.9,.5]])],
  [9.5,()=>burst(-14,24,-75,12,700,[[1,1,1],[.85,.95,1]],4)],[10.3,()=>burst(14,18,-80,7,200,[[1,.5,.7]])],[10.8,()=>burst(-2,30,-80,7,200,[[1,.8,.4]])]];
const CAPS=[[0,3.4,'8 November 2026\nHappy Diwali :'],[3.9,5.7,'Sunte Hai Jab Pyaa..'],[7.2,9.3,'Diye Jal Uthte Hai...'],[9.4,12,'Tan Man'],[13.6,16,'Diye Jal Uthte Hai...']];
let idx=0,prev=0,last=performance.now(),capK=-1;
function clearAll(){life.fill(0);idx=0;}
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;const t=aud.currentTime;if(t<prev-.5)clearAll();prev=t;
  while(idx<SHOW.length&&SHOW[idx][0]<=t)SHOW[idx++][1]();
  const seg=t<3.5?0:t<5.8?1:t<13.2?2:3;
  ghat.visible=seg<2;diya.visible=seg===3;lant.visible=seg===2;bigs.forEach(b=>b.m.visible=b.g.visible=seg===2);orangeCloud.material.opacity=seg===1?.35:0;
  tag.textContent=t>3.5?'HAPPY DIWALI':'';
  if(seg===0){const k=t/3.5;cam.position.set(2,24-8*k,10-4*k);cam.lookAt(-4,0,-34);}
  else if(seg===1){cam.position.set(0,3,0);cam.lookAt(0,10+(t-3.5),-60);}
  else if(seg===2){const lt=t-5.8,up=ease(lt/3);cam.position.set(Math.sin(lt*.4)*1.2,0,0);cam.lookAt(0,-6+up*26,-60);
    for(let i=0;i<NL;i++){let y=LP.getY(i)+LSP[i]*dt;if(y>66)y-=74;LP.setY(i,y);}LP.needsUpdate=true;
    bigs.forEach((b,i)=>{const y=b.y0+Math.max(0,lt-3.6)*(i?.9:1.3)+Math.sin(t*1.3+i)*.3;b.m.position.y=y;b.g.position.y=y-2;});}
  else {cam.position.set(0,20,-2+Math.sin(t*.5));cam.lookAt(0,0,-6);flames.forEach(([f,h,i])=>{const k=1+.18*Math.sin(t*17+i*2)+.1*Math.sin(t*31+i);f.scale.setScalar(5*k);h.scale.setScalar(16*(.95+.1*k));});}
  dimEl.style.opacity=t<11.4?0:t<13.2?Math.min(.85,.85*ease((t-11.4)/.8)):Math.max(0,.85*(1-ease((t-13.2)/.4)));
  stepPool(dt,t);
  const ci=CAPS.findIndex(c=>t>=c[0]&&t<c[1]);if(ci!==capK){capK=ci;capEl.innerHTML=ci<0?'':CAPS[ci][2].split('\n').map(l=>l.split(' ').map((w,j)=>`<span style="animation-delay:${j*.18}s">${w}</span>`).join(' ')).join('<br>');}
  R.render(scene,cam);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.getElementById('go').onclick=async()=>{document.getElementById('start').remove();aud.currentTime=0;clearAll();try{await aud.play();}catch(e){console.error(e);}};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();aud.paused?aud.play():aud.pause();}});
</script>
</body>
</html>
